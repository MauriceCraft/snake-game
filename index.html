<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Snake — MauriceCraft</title>
  <meta name="description" content="A Google Snake-style browser game. Eat apples, grow long, don't bite yourself." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23578a34'/%3E%3Crect x='6' y='14' width='18' height='6' rx='3' fill='%234a78f0'/%3E%3Ccircle cx='25' cy='17' r='4' fill='%234a78f0'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="hud">
      <div class="hud-block">
        <span class="hud-label">Apples</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-title" aria-hidden="true">
        <svg class="hud-logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#578a34"/>
          <rect x="6" y="14" width="18" height="6" rx="3" fill="#4a78f0"/>
          <circle cx="25" cy="17" r="4" fill="#4a78f0"/>
        </svg>
        <span class="hud-name">Snake</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">Best</span>
        <span class="hud-value" id="best">0</span>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="game" width="544" height="480" role="img" aria-label="Snake game board"></canvas>

      <div class="overlay" id="overlay">
        <div class="panel" id="panel-title">
          <h1 class="panel-title-text">Snake</h1>
          <p class="panel-sub">Eat apples. Grow long. Don't bite yourself.</p>
          <button class="btn" id="btn-start" type="button">Play</button>
          <p class="panel-hint">Arrows / WASD to move &middot; swipe on touch &middot; <span class="key">Space</span> to pause</p>
        </div>

        <div class="panel hidden" id="panel-paused">
          <h1 class="panel-title-text">Paused</h1>
          <button class="btn" id="btn-resume" type="button">Resume</button>
        </div>

        <div class="panel hidden" id="panel-over">
          <h1 class="panel-title-text">Game Over</h1>
          <p class="panel-sub" id="over-stats">You ate 0 apples.</p>
          <button class="btn" id="btn-retry" type="button">Play Again</button>
        </div>
      </div>
    </div>

    <div class="footnote-row">
      <button class="mute-btn" id="btn-mute" type="button" aria-label="Mute sound">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
      </button>
      <p class="footnote">Made by Maurice &middot; inspired by Google Snake</p>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
